name: Verify public lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m pytest -q
      - run: npm test
      - run: npm run build
      - run: python scripts/verify_benchmarks.py
      - run: npm run verify:replays
      - run: python scripts/check_notebooks.py --execute-results
      - run: python scripts/audit_publication.py
  decoder-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_decision.py
